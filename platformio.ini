[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Явно задаем стандарт C++ для всего проекта.
; Arduino-ESP32 в некоторых версиях по умолчанию добавляет -std=gnu++11,
; поэтому старый флаг сначала убираем и затем включаем GNU C++17.
build_unflags =
    -std=gnu++11
    -std=c++11

build_flags =
    -std=gnu++17

; Все используемые библиотеки лежат локально в папке lib/.
; lib_deps намеренно отсутствует: проект собирается без скачивания библиотек.
